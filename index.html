<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lê Tuấn Anh | Profile Link</title>
    <link rel="stylesheet" href="style.css">
    <!-- Nhúng thư viện hiệu ứng biểu tượng Font Awesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <!-- Lớp nền mờ chuyển động phía sau -->
    <div class="background-glow">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <!-- Hộp thông tin chính (Profile Card) -->
    <div class="profile-card">
        
        <!-- Khu vực ảnh đại diện chú mèo ôm bia Asahi -->
        <div class="avatar-container">
            <img src="https://squarespace-cdn.com" alt="Lê Tuấn Anh Avatar">
            <div class="verified-badge" title="Đã xác minh"><i class="fa-solid fa-circle-check"></i></div>
        </div>

        <!-- Thông tin cá nhân tối giản -->
        <div class="profile-info">
            <h1>Lê Tuấn Anh</h1>
        </div>

        <!-- Danh sách các nút liên kết mạng xã hội chính -->
        <div class="links-container">
            
            <!-- Nút Facebook cá nhân -->
            <a href="https://facebook.com" target="_blank" class="link-item item-facebook">
                <div class="link-icon"><i class="fa-brands fa-facebook-f"></i></div>
                <span>Kết nối qua Facebook</span>
                <div class="arrow-icon"><i class="fa-solid fa-chevron-right"></i></div>
            </a>

            <!-- Nút TikTok cá nhân -->
            <a href="https://tiktok.com" target="_blank" class="link-item item-tiktok">
                <div class="link-icon"><i class="fa-brands fa-tiktok"></i></div>
                <span>Theo dõi tôi trên TikTok</span>
                <div class="arrow-icon"><i class="fa-solid fa-chevron-right"></i></div>
            </a>

        </div>

        <!-- Chân trang nhỏ gọn tinh tế -->
        <div class="profile-footer">
            <p>&copy; 2026 Designed by TuanAnh. All rights reserved.</p>
        </div>

    </div>

</body>
</html>
